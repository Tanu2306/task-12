# kubernetes/02-secrets.yaml
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  WARNING: Do NOT commit real credentials here.
#    The base64 values below are PLACEHOLDER examples only.
#    In a real project use a secrets manager (Vault, AWS Secrets Manager,
#    Sealed Secrets, or External Secrets Operator) and add this file to
#    .gitignore.
#
# To generate your own base64 values (Linux/Mac):
#   echo -n 'mysecretpassword' | base64
#
# Current placeholder encodings:
#   shoppass  → c2hvcHBhc3M=
#   shopuser  → c2hvcHVzZXI=
#   shopdb    → c2hvcGRi
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: shop
  labels:
    app: shop
    component: secrets
type: Opaque
data:
  # base64("shoppass") – REPLACE with a strong password before deploying
  DB_PASSWORD: c2hvcHBhc3M=

  # base64("shopuser") – must match ConfigMap DB_USER
  DB_USER: c2hvcHVzZXI=

  # base64("shopdb") – must match ConfigMap DB_NAME
  DB_NAME: c2hvcGRi
