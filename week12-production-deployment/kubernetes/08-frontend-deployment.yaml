# kubernetes/08-frontend-deployment.yaml
# ─────────────────────────────────────────────────────────────────────────────
# React + Nginx frontend – 2 replicas.
#
# IMAGE NOTE (Minikube):
#   eval $(minikube docker-env)
#   docker build -t shop-frontend:latest ./frontend
#   imagePullPolicy: Never → uses the locally built image.
#
# Liveness/Readiness probes hit the Nginx root path (index.html).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
  labels:
    app: frontend
    component: ui
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: frontend
        component: ui
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "false"   # Nginx has no /actuator/prometheus
    spec:
      securityContext:
        runAsNonRoot: false             # Nginx master needs root for port 80
        # Workers run as nginx user (UID 101) by default in nginx:alpine

      terminationGracePeriodSeconds: 15

      containers:
        - name: frontend
          image: shop-frontend:latest
          imagePullPolicy: Never        # Minikube: use locally built image

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          # ── Resource requests / limits ─────────────────────────────
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"

          # ── Liveness probe ─────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness probe ────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
