# kubernetes/10-ingress.yaml
# ─────────────────────────────────────────────────────────────────────────────
# NGINX Ingress Controller routes for shop.local.
#
# Prerequisites:
#   minikube addons enable ingress
#   # After applying, add this line to /etc/hosts (or C:\Windows\System32\drivers\etc\hosts):
#   # <minikube ip>   shop.local
#   # Get minikube ip with: minikube ip
#
# Routing rules:
#   /api/*  → backend-service:8080   (Spring Boot REST API)
#   /       → frontend-service:80    (React SPA via Nginx)
#
# The NGINX Ingress rewrite-target annotation strips the /api prefix before
# forwarding to the backend so Spring Boot receives paths as /api/... intact.
# We do NOT strip here because Spring Boot controllers are mapped to /api/**.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop-ingress
  namespace: shop
  labels:
    app: shop
    component: ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"

    # ── Backend-specific annotations ────────────────────────────────
    # Increase proxy timeouts for slow DB queries during demo load tests
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # ── Body size (for future file uploads) ─────────────────────────
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    # ── Enable gzip compression ──────────────────────────────────────
    nginx.ingress.kubernetes.io/enable-compression: "true"

    # ── CORS passthrough (handled by Spring Boot CorsConfig) ─────────
    nginx.ingress.kubernetes.io/enable-cors: "false"

spec:
  ingressClassName: nginx

  rules:
    - host: shop.local
      http:
        paths:
          # ── API path → Spring Boot backend ────────────────────────
          # PathType Prefix: /api matches /api, /api/, /api/products, etc.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  name: http

          # ── Catch-all → React SPA (Nginx) ─────────────────────────
          # Must be listed AFTER /api so the more specific route wins.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  name: http
