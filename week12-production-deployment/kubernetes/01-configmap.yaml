# kubernetes/01-configmap.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Non-sensitive configuration consumed by the backend Deployment as env vars.
# Sensitive values (passwords) are stored separately in 02-secrets.yaml.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
  labels:
    app: shop
    component: config
data:
  # ── PostgreSQL connection (non-secret) ─────────────────────────────────
  DB_HOST: "postgres-service"   # matches the Postgres ClusterIP Service name
  DB_PORT: "5432"
  DB_NAME: "shopdb"
  DB_USER: "shopuser"

  # ── Spring Boot / JVM tuning ───────────────────────────────────────────
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport"

  # ── CORS (frontend is served by Nginx Ingress on shop.local) ──────────
  CORS_ALLOWED_ORIGINS: "http://shop.local,https://shop.local"
