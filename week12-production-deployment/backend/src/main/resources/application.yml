# ── application.yml ─────────────────────────────────────────────────────────
# All connection details are read from environment variables with safe local
# defaults so the app starts without Docker Compose for IDE development.
# ─────────────────────────────────────────────────────────────────────────────

spring:
  application:
    name: shop-backend

  # ── DataSource ──────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopdb}
    username: ${DB_USER:shopuser}
    password: ${DB_PASSWORD:shoppass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ── JPA / Hibernate ──────────────────────────────────────────────────────
  jpa:
    hibernate:
      # validate – schema managed by init.sql (no auto-migration)
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Actuator & Micrometer ────────────────────────────────────────────────────
management:
  server:
    port: 8080
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        # Expose /actuator/health/liveness and /actuator/health/readiness
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.shop: INFO
    org.springframework.web: WARN
