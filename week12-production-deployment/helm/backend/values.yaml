# helm/backend/values.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Default values for the shop-backend chart.
# Override with --set or -f my-values.yaml:
#   helm upgrade --install shop-backend ./helm/backend \
#     --set image.tag=abc123 \
#     --set db.password=supersecret \
#     --namespace shop --create-namespace
# ─────────────────────────────────────────────────────────────────────────────

# ── Replica count (overridden by HPA when autoscaling.enabled=true) ────────
replicaCount: 2

# ── Container image ────────────────────────────────────────────────────────
image:
  repository: shop-backend        # Override with ghcr.io/<org>/shop-backend for CD
  tag: "latest"                   # Set to commit SHA in CI/CD pipelines
  pullPolicy: Never               # "Never" = Minikube local build
                                  # "IfNotPresent" / "Always" for registries

# ── Image pull secrets ─────────────────────────────────────────────────────
imagePullSecrets: []
# - name: ghcr-creds

# ── Name overrides ─────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

# ── Service account ────────────────────────────────────────────────────────
serviceAccount:
  create: false
  name: ""

# ── Pod annotations ────────────────────────────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path:   "/actuator/prometheus"
  prometheus.io/port:   "8080"

# ── Pod security context ───────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# ── Container security context ─────────────────────────────────────────────
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # Spring Boot writes temp files; keep false
  capabilities:
    drop:
      - ALL

# ── Service ────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  name: http

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: shop.local
  path: /api
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/enable-cors: "false"   # CORS handled by Spring
  tls: []

# ── Resource requests and limits ──────────────────────────────────────────
resources:
  requests:
    cpu: "250m"
    memory: "384Mi"
  limits:
    cpu: "750m"
    memory: "768Mi"

# ── Probes (paths match Spring Actuator endpoints) ─────────────────────────
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 10
  timeoutSeconds: 5

# ── Rolling update strategy ────────────────────────────────────────────────
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ── HPA (Horizontal Pod Autoscaler) ───────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  # Optional memory scaling (requires custom metrics server):
  targetMemoryUtilizationPercentage: null
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Max

# ── Database connection (non-secret values) ────────────────────────────────
db:
  host: "postgres-service"        # Kubernetes Service name in the same namespace
  port: "5432"
  name: "shopdb"
  user: "shopuser"
  # ⚠ DO NOT commit real passwords here.
  # Supply via --set db.password=... or an external secret in production.
  password: "shoppass"            # Override with --set db.password=<real> or use existingSecret

  # If existingSecret is set, DB_USER/DB_PASSWORD/DB_NAME are read from that
  # Secret instead of the plain db.user/db.password/db.name values above.
  existingSecret: ""              # e.g. "shop-secrets"
  existingSecretKeys:
    password: "DB_PASSWORD"
    user:     "DB_USER"
    name:     "DB_NAME"

# ── Application environment variables (merged into the Deployment env block) 
env:
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
  CORS_ALLOWED_ORIGINS: "http://shop.local,https://shop.local"

# ── Node scheduling ────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
