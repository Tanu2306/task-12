{{/*
helm/backend/templates/secret.yaml
─────────────────────────────────────────────────────────────────────────────
Chart-managed Secret for DB credentials.
Skipped when db.existingSecret is set (external secret management).
⚠  Do NOT commit real passwords in values.yaml.
   Supply via: helm install ... --set db.password=<real>
   Or use Sealed Secrets / External Secrets Operator.
─────────────────────────────────────────────────────────────────────────────
*/}}
{{- if not .Values.db.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-db-secret" (include "shop-backend.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop-backend.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # Retain secret on helm uninstall
type: Opaque
data:
  DB_PASSWORD: {{ .Values.db.password | b64enc | quote }}
  DB_USER:     {{ .Values.db.user     | b64enc | quote }}
  DB_NAME:     {{ .Values.db.name     | b64enc | quote }}
{{- end }}
