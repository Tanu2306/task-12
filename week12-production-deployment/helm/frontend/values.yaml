# helm/frontend/values.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Default values for the shop-frontend chart.
# Override any value with:
#   helm install shop-frontend ./helm/frontend --set image.tag=abc123
# or by supplying a custom values file:
#   helm install shop-frontend ./helm/frontend -f my-values.yaml
# ─────────────────────────────────────────────────────────────────────────────

# ── Replica count ──────────────────────────────────────────────────────────
replicaCount: 2

# ── Container image ────────────────────────────────────────────────────────
image:
  repository: shop-frontend       # Override with ghcr.io/<org>/shop-frontend for CD
  tag: "latest"                   # Override with commit SHA in CI/CD
  pullPolicy: Never               # "Never" for Minikube local builds;
                                  # change to "Always" or "IfNotPresent" for registries

# ── Image pull secrets (leave empty for local Minikube) ───────────────────
imagePullSecrets: []

# ── Name overrides ─────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

# ── Service account ────────────────────────────────────────────────────────
serviceAccount:
  create: false
  name: ""

# ── Pod annotations ────────────────────────────────────────────────────────
podAnnotations:
  prometheus.io/scrape: "false"   # Nginx has no /actuator/prometheus

# ── Pod security context ───────────────────────────────────────────────────
podSecurityContext: {}

# ── Container security context ─────────────────────────────────────────────
securityContext: {}

# ── Service ────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 80
  name: http

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: shop.local
  # Path for the frontend (catch-all – must come after /api in shared Ingress)
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/enable-compression: "true"
  tls: []
  # tls:
  #   - secretName: shop-tls
  #     hosts:
  #       - shop.local

# ── Resource requests and limits ──────────────────────────────────────────
resources:
  requests:
    cpu: "50m"
    memory: "64Mi"
  limits:
    cpu: "200m"
    memory: "128Mi"

# ── Liveness probe ─────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 5
  failureThreshold: 3

# ── Readiness probe ────────────────────────────────────────────────────────
readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# ── Rolling update strategy ────────────────────────────────────────────────
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ── Node scheduling ────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Autoscaling (not applicable to stateless Nginx – disabled by default) ──
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
