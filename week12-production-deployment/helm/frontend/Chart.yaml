apiVersion: v2
name: shop-frontend
description: >
  Helm chart for the ShopLocal React + Nginx frontend.
  Deploys the static SPA served by Nginx alpine with configurable
  replicas, resources, and an optional NGINX Ingress rule.
type: application
version: 1.0.0          # Chart version – bump on chart changes
appVersion: "1.0.0"     # Application version – set to image tag on deploy
keywords:
  - frontend
  - react
  - nginx
  - shop
  - week12
maintainers:
  - name: Student DevOps
    email: student@example.com
